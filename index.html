<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevPulse - Ping Serveur</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- En-tête -->
    <header class="header">
      <h1>DevPulse</h1>
      <p>Surveillance de serveur</p>
    </header>

    <!-- Widget : Ping Serveur -->
    <main class="widget-grid">
      <section class="card">
        <h2>Surveillance Serveur</h2>
        <p class="card-desc">Mesure la latence d'un serveur ou site web</p>

        <!-- Formulaire de test -->
        <div class="ping-form">
          <input 
            type="text" 
            id="url-input" 
            placeholder="ex: https://google.com" 
            value="https://google.com"
          >
          <button id="ping-btn" type="button">Tester</button>
        </div>

        <!-- Résultat -->
        <div id="result-box" class="result-box">
          <div class="status-indicator">
            <span id="status-dot" class="dot"></span>
            <span id="status-text">En attente d'un test...</span>
          </div>
          <div class="latency-display">
            <span id="latency-value">--</span> <span class="unit">ms</span>
          </div>
        </div>

        <!-- Zone pour ton futur historique (à coder par toi-même) -->
        <div class="history-section">
          <h3>Historique récent</h3>
          <ul id="history-list">
            <!-- À toi d'insérer les résultats précédents ici en JS ! -->
          </ul>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
